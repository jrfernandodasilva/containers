# TEMPORARY: cold-build timing of the -grpc variant on native runners. Never pushes. Delete before merging.
name: TMP grpc timing

on:
  push:
    branches: ["ci/native-arm64"]

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build (cold, no push)
        uses: docker/build-push-action@v7
        with:
          context: ./php-nginx
          file: php-nginx/Dockerfile-grpc
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            PHP_VERSION=8.0.30
            ALPINE_VERSION=3.16
            PROTOBUF_VERSION=3.25.5
            REDIS_VERSION=6.1.0
            PDO_DRIVER=mysql
            OPCACHE_FILE_NAME=opcache-php8.ini
          push: false
          no-cache: true
