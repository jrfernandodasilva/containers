name: Docker Image CI NGINX

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/docker-image-php-nginx.yml'
      - 'php-nginx/**'

jobs:
  # Each platform builds on its own native runner (arm64 under QEMU took ~4h for grpc)
  # and pushes by digest. The merge job joins both digests under the tag.
  build:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
        php_config: &php_configs
          - php: '8.5.12'
            alpine: '3.24'
            redis: '6.3.0'
            pdo_driver: mysql
            opcache_file: opcache-php8.ini
            tags: fernandojrdev/php-nginx:8.5.12-alpine3.24
          - php: '8.4.27'
            alpine: '3.24'
            redis: '6.3.0'
            pdo_driver: mysql
            opcache_file: opcache-php8.ini
            tags: fernandojrdev/php-nginx:8.4.27-alpine3.24
          - php: '8.4.27'
            alpine: '3.24'
            redis: '6.3.0'
            pdo_driver: pgsql
            opcache_file: opcache-php8.ini
            tags: fernandojrdev/php-nginx:8.4.27-alpine3.24-pgsql
          # - php: '8.4.27'
          #   alpine: '3.24'
          #   redis: '6.3.0'
          #   pdo_driver: firebird
          #   opcache_file: opcache-php8.ini
          #   tags: fernandojrdev/php-nginx:8.4.27-alpine3.24-firebird
          # - php: '8.4.27'
          #   alpine: '3.24'
          #   redis: '6.3.0'
          #   pdo_driver: sqlite
          #   opcache_file: opcache-php8.ini
          #   tags: fernandojrdev/php-nginx:8.4.27-alpine3.24-sqlite
          # - php: '8.4.27'
          #   alpine: '3.24'
          #   redis: '6.3.0'
          #   pdo_driver: odbc
          #   opcache_file: opcache-php8.ini
          #   tags: fernandojrdev/php-nginx:8.4.27-alpine3.24-odbc
          - php: '8.4.27'
            alpine: '3.24'
            redis: '6.3.0'
            pdo_driver: dblib
            opcache_file: opcache-php8.ini
            tags: fernandojrdev/php-nginx:8.4.27-alpine3.24-dblib
          - php: '8.3.36'
            alpine: '3.24'
            redis: '6.1.0'
            pdo_driver: mysql
            opcache_file: opcache-php8.ini
            tags: fernandojrdev/php-nginx:8.3.36-alpine3.24
          - php: '8.2.35'
            alpine: '3.24'
            redis: '6.1.0'
            pdo_driver: mysql
            opcache_file: opcache-php8.ini
            tags: fernandojrdev/php-nginx:8.2.35-alpine3.24
          - php: '8.1.34'
            alpine: '3.22'
            redis: '6.1.0'
            pdo_driver: mysql
            opcache_file: opcache-php8.ini
            tags: fernandojrdev/php-nginx:8.1.34-alpine3.22
          - php: '8.0.30'
            alpine: '3.16'
            redis: '6.1.0'
            pdo_driver: mysql
            opcache_file: opcache-php8.ini
            tags: fernandojrdev/php-nginx:8.0.30-alpine3.16
          - php: '8.0.30'
            alpine: '3.16'
            protobuf: '3.25.5'
            redis: '6.1.0'
            pdo_driver: mysql
            opcache_file: opcache-php8.ini
            dockerfile: php-nginx/Dockerfile-grpc
            tags: fernandojrdev/php-nginx:8.0.30-alpine3.16-grpc
          - php: '7.4.33'
            alpine: '3.16'
            redis: '6.1.0'
            pdo_driver: mysql
            opcache_file: opcache-php7.ini
            tags: fernandojrdev/php-nginx:7.4.33-alpine3.16
          - php: '7.4.33'
            alpine: '3.16'
            redis: '6.1.0'
            pdo_driver: pgsql
            opcache_file: opcache-php7.ini
            tags: fernandojrdev/php-nginx:7.4.33-alpine3.16-pgsql
          # - php: '7.4.33'
          #   alpine: '3.16'
          #   redis: '6.1.0'
          #   pdo_driver: firebird
          #   opcache_file: opcache-php7.ini
          #   tags: fernandojrdev/php-nginx:7.4.33-alpine3.16-firebird
          # - php: '7.4.33'
          #   alpine: '3.16'
          #   redis: '6.1.0'
          #   pdo_driver: sqlite
          #   opcache_file: opcache-php7.ini
          #   tags: fernandojrdev/php-nginx:7.4.33-alpine3.16-sqlite
          # - php: '7.4.33'
          #   alpine: '3.16'
          #   redis: '6.1.0'
          #   pdo_driver: odbc
          #   opcache_file: opcache-php7.ini
          #   tags: fernandojrdev/php-nginx:7.4.33-alpine3.16-odbc
          - php: '7.4.33'
            alpine: '3.16'
            redis: '6.1.0'
            pdo_driver: dblib
            opcache_file: opcache-php7.ini
            tags: fernandojrdev/php-nginx:7.4.33-alpine3.16-dblib
          - php: '7.3.33'
            alpine: '3.15'
            redis: '6.0.2'
            pdo_driver: mysql
            opcache_file: opcache-php7.ini
            tags: fernandojrdev/php-nginx:7.3.33-alpine3.15
          - php: '7.2.34'
            alpine: '3.12'
            redis: '6.0.2'
            pdo_driver: mysql
            opcache_file: opcache-php7.ini
            tags: fernandojrdev/php-nginx:7.2.34-alpine3.12
    steps:
      - uses: actions/checkout@v7

      - name: Validate Docker Tags
        run: |
          echo "Validating tag: ${{ matrix.php_config.tags }}"
          if [[ "${{ matrix.php_config.tags }}" =~ ^fernandojrdev/php-nginx:[0-9]+\.[0-9]+\.[0-9]+-alpine[0-9]+\.[0-9]+(-[a-z]+)?$ ]]; then
            echo "Tag '${{ matrix.php_config.tags }}' is valid."
          else
            echo "Error: Tag '${{ matrix.php_config.tags }}' does not match expected format."
            exit 1
          fi

      - name: Split tag
        id: tag
        run: |
          tag='${{ matrix.php_config.tags }}'
          echo "repo=${tag%%:*}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#*:}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./php-nginx
          file: ${{ matrix.php_config.dockerfile || 'php-nginx/Dockerfile' }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            PHP_VERSION=${{ matrix.php_config.php }}
            ALPINE_VERSION=${{ matrix.php_config.alpine }}
            PROTOBUF_VERSION=${{ matrix.php_config.protobuf }}
            REDIS_VERSION=${{ matrix.php_config.redis }}
            PDO_DRIVER=${{ matrix.php_config.pdo_driver }}
            OPCACHE_FILE_NAME=${{ matrix.php_config.opcache_file }}
          outputs: type=image,name=${{ steps.tag.outputs.repo }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.php_config.tags }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.php_config.tags }}-${{ matrix.platform.arch }}

      - name: Save digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo '${{ steps.build.outputs.digest }}' > "$RUNNER_TEMP/digests/${{ matrix.platform.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ steps.tag.outputs.version }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.platform.arch }}
          retention-days: 1

  merge:
    needs: build
    # Run even if another variant failed; a variant missing a digest fails on its own.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_config: *php_configs
    steps:
      - name: Split tag
        id: tag
        run: |
          tag='${{ matrix.php_config.tags }}'
          echo "repo=${tag%%:*}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#*:}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: digest-${{ steps.tag.outputs.version }}-amd64
          path: ${{ runner.temp }}/digests

      - uses: actions/download-artifact@v8
        with:
          name: digest-${{ steps.tag.outputs.version }}-arm64
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch tag
        env:
          REPO: ${{ steps.tag.outputs.repo }}
          TAG: ${{ matrix.php_config.tags }}
        run: |
          cd "$RUNNER_TEMP/digests"
          docker buildx imagetools create -t "$TAG" "$REPO@$(cat amd64)" "$REPO@$(cat arm64)"
          docker buildx imagetools inspect "$TAG"